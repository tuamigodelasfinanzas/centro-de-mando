<title>Centro de mando</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con frescura y créditos · semáforo de 4 proyectos · cola de publicaciones · detalle plegable por proyecto */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#15211f; --mute:#5d6b68; --line:#d5dcda;
  --accent:#1f5e55; --accent-soft:#dbe9e5;
  --ok:#1d7a4a; --ok-bg:#dcf1e4; --warn:#a15c00; --warn-bg:#fbebd2; --bad:#b4232a; --bad-bg:#fadcdc;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#172120; --ink:#e4ecea; --mute:#93a3a0; --line:#2a3634;
  --accent:#6cc2b3; --accent-soft:#1d3531;
  --ok:#5fd18f; --ok-bg:#16301f; --warn:#f0b55c; --warn-bg:#352612; --bad:#ff7d7d; --bad-bg:#3a1a1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#172120; --ink:#e4ecea; --mute:#93a3a0; --line:#2a3634;
  --accent:#6cc2b3; --accent-soft:#1d3531;
  --ok:#5fd18f; --ok-bg:#16301f; --warn:#f0b55c; --warn-bg:#352612; --bad:#ff7d7d; --bad-bg:#3a1a1b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;font-stretch:80%;letter-spacing:-.01em;line-height:1.05}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
h3{font-size:20px;font-weight:750;font-stretch:85%}
.data{font-family:var(--f-data);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.sub{color:var(--mute);margin-top:6px}
.fresh{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.viejo{background:var(--warn)}
.meter{min-width:240px;display:grid;gap:6px}
.meter .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.handle{color:var(--mute);font-size:13px}
.pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.verde{background:var(--ok-bg);color:var(--ok)} .pill.ambar{background:var(--warn-bg);color:var(--warn)} .pill.rojo{background:var(--bad-bg);color:var(--bad)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.nums b{display:block;font:500 20px var(--f-data);font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issues li{font-size:14px;padding:8px 10px;border-radius:6px;background:var(--warn-bg)}
.issues li.rojo{background:var(--bad-bg)}
.issues li small{display:block;color:var(--mute);margin-top:2px}
.next{font-size:13px;color:var(--mute)} .next b{color:var(--ink);font-weight:600}
.ok-line{font-size:14px;color:var(--ok)}

.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
section{display:grid;gap:12px;min-width:0}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.list .r{display:grid;grid-template-columns:96px 22px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.list .r:first-child{border-top:0}
.list .r .t{font-size:13px;color:var(--mute)}
.empty{padding:14px;color:var(--mute)}

details{background:var(--panel);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:12px 14px;font-weight:650;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--mute);transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary .c{margin-left:auto;font-size:13px;color:var(--mute);font-weight:400}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{text-align:left;padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);border-top:0}
td.st{white-space:nowrap}
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.mk.ok{background:var(--ok)} .mk.error{background:var(--bad)} .mk.aviso{background:var(--warn)}
.off{color:var(--mute)}
footer{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Centro de mando</h1>
      <div class="sub"><span class="fresh"><span class="dot" id="dot"></span><span id="fresh">Cargando…</span></span></div>
    </div>
    <div class="meter" id="meter" hidden>
      <div class="row"><span>Créditos de Make este mes</span><span class="data" id="credTxt"></span></div>
      <div class="bar"><i id="credBar"></i></div>
    </div>
  </header>

  <div class="grid" id="cards"></div>

  <div class="cols">
    <section>
      <h2>Próximas publicaciones</h2>
      <div class="list" id="next"></div>
    </section>
    <section>
      <h2>Escenarios y workflows</h2>
      <div id="detail" style="display:grid;gap:10px"></div>
    </section>
  </div>

  <footer>Para actuar, escribe al bot de Telegram del centro de mando: /estado, /pendientes, /lanzar, /pausar, /activar. El agente nunca cambia nada sin tu ✅.</footer>
</div>

<script id="foto" type="application/json">null</script>
<script>
const RAW = "https://raw.githubusercontent.com/tuamigodelasfinanzas/centro-de-mando/estado/status.json";
const tz = {timeZone:"Europe/Madrid"};
const fmt = d => new Date(d).toLocaleString("es-ES",{...tz,weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const hm = d => new Date(d).toLocaleString("es-ES",{...tz,hour:"2-digit",minute:"2-digit"});
const dia = d => new Date(d).toLocaleString("es-ES",{...tz,weekday:"short",day:"numeric"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ETQ = {verde:"Todo bien", ambar:"Revisar", rojo:"Falla algo"};

function pintar(s, enVivo){
  const act = new Date(s.actualizado), min = Math.round((Date.now()-act)/60000);
  const viejo = min > 90;
  document.getElementById("dot").classList.toggle("viejo", viejo);
  document.getElementById("fresh").textContent =
    (enVivo ? "Datos de " : "Foto de ") + fmt(s.actualizado) + (min < 120 ? ` · hace ${min} min` : "") + (viejo && enVivo ? " · el agente lleva rato sin actualizar" : "");

  if (s.creditos){
    document.getElementById("meter").hidden = false;
    document.getElementById("credTxt").textContent = `${s.creditos.usados.toLocaleString("es-ES")} / ${s.creditos.limite.toLocaleString("es-ES")} (${s.creditos.pct} %)`;
    document.getElementById("credBar").style.width = Math.min(100, s.creditos.pct) + "%";
  }

  document.getElementById("cards").innerHTML = s.proyectos.map(p => {
    const n = p.proximas[0];
    const inc = p.incidencias.length
      ? `<ul class="issues">${p.incidencias.map(i => `<li class="${i.nivel}">${esc(i.texto)}${i.propuesta ? `<small>Propuesta esperando tu OK en Telegram</small>` : ""}</li>`).join("")}</ul>`
      : `<div class="ok-line">Sin incidencias</div>`;
    const rec = p.make.recuperados_36h ? `, ${p.make.recuperados_36h} recuperados` : "";
    return `<article class="card">
      <div class="top"><div><h3>${esc(p.nombre)}</h3><div class="handle">${p.instagram ? "@"+esc(p.instagram) : "&nbsp;"}</div></div>
        <span class="pill ${p.semaforo}">${ETQ[p.semaforo]}</span></div>
      <div class="nums">
        <div><b>${p.make.activos}/${p.make.total}</b><span>escenarios activos</span></div>
        <div><b>${p.make.fallos_36h}</b><span>fallos Make 36 h${rec}</span></div>
        <div><b>${p.github.fallidas_36h}/${p.github.ejecuciones_36h}</b><span>GitHub fallidas 36 h</span></div>
      </div>
      ${inc}
      ${n ? `<div class="next">Siguiente: <b>${esc(n.nombre)}</b> · ${fmt(n.cuando)}</div>` : ""}
    </article>`;
  }).join("");

  const cola = s.proyectos.flatMap(p => p.escenarios.filter(e => e.activo && e.proxima && new Date(e.proxima) > Date.now())
      .map(e => ({...e, emoji: p.emoji}))).sort((a,b) => a.proxima.localeCompare(b.proxima)).slice(0, 14);
  document.getElementById("next").innerHTML = cola.length ? cola.map(e =>
    `<div class="r"><span class="data t">${dia(e.proxima)} ${hm(e.proxima)}</span><span>${e.emoji}</span><a href="${e.enlace}" target="_blank" rel="noopener">${esc(e.nombre)}</a></div>`).join("")
    : `<div class="empty">No hay publicaciones programadas.</div>`;

  document.getElementById("detail").innerHTML = s.proyectos.map(p => {
    const filas = p.escenarios.map(e => {
      const u = e.ultimo;
      return `<tr><td><a href="${e.enlace}" target="_blank" rel="noopener" class="${e.activo ? "" : "off"}">${esc(e.nombre)}</a>${e.activo ? "" : " <span class='off'>(apagado)</span>"}</td>
        <td class="st">${u ? `<span class="mk ${u.estado}"></span><span class="data">${fmt(u.cuando)}</span>` : "<span class='off'>sin ejecuciones 36 h</span>"}</td>
        <td class="data st">${e.proxima && e.activo ? fmt(e.proxima) : "—"}</td></tr>`;
    }).join("");
    const wf = p.workflows.map(w => `<tr><td><a href="${w.url}" target="_blank" rel="noopener">${esc(w.workflow)}</a></td>
        <td class="st"><span class="mk ${w.ultimo === "success" ? "ok" : w.ultimo === "failure" ? "error" : ""}"></span><span class="data">${fmt(w.cuando)}</span></td>
        <td class="data">${w.fallidas ? w.fallidas + " fallos de " : ""}${w.ejecuciones}</td></tr>`).join("");
    return `<details><summary>${p.emoji} ${esc(p.nombre)} <span class="c">${p.escenarios.length} escenarios · ${p.workflows.length} workflows</span></summary>
      <div class="tbl"><table><thead><tr><th>Escenario de Make</th><th>Última ejecución</th><th>Próxima</th></tr></thead><tbody>${filas || "<tr><td colspan=3 class=off>Ninguno</td></tr>"}</tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Workflow de GitHub</th><th>Última</th><th>Ejecuciones 36 h</th></tr></thead><tbody>${wf || "<tr><td colspan=3 class=off>Ninguna en 36 h</td></tr>"}</tbody></table></div>
    </details>`;
  }).join("");
}

let foto = null;
try { foto = JSON.parse(document.getElementById("foto").textContent); } catch(e) {}
if (foto) pintar(foto, false);

// 1º la API de GitHub (sin caché larga); si falla, la copia raw
const API = "https://api.github.com/repos/tuamigodelasfinanzas/centro-de-mando/contents/status.json?ref=estado";
async function cargar(){
  try {
    const r = await fetch(API + "&t=" + Date.now(), {headers:{Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  }
}
function refrescar(){
  cargar().then(s => pintar(s, true)).catch(() => {
    if (!foto) document.getElementById("fresh").textContent = "No pude leer los datos del agente. Recarga la página en un minuto.";
  });
}
refrescar();
setInterval(refrescar, 5 * 60 * 1000);
</script>
